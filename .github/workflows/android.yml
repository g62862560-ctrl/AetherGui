name: Android APK

on:
  push:
    paths:
      - 'flutter/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Style hints do not fail the build; real errors do.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Fetch aether and build hev-socks5-tunnel
        run: bash fetch_aether.sh

      # Without these secrets the APK gets a throwaway debug key, so each
      # build must be uninstalled before the next one can be installed.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "No signing secrets: using the debug key."; exit 0; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          sed -i 's/^ *//' android/key.properties

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: aether-android-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

# Publication is intentionally unavailable in Actions. CLAUDE.md requires
# release.bat/release.sh as the single release path so signing, reports,
# versioning, tags and assets cannot diverge.
name: Release policy guard

on:
  pull_request:
    paths:
      - 'release.sh'
      - 'release.bat'
      - '.github/workflows/release.yml'
      - 'CLAUDE.md'
  push:
    branches: [main]
    paths:
      - 'release.sh'
      - 'release.bat'
      - '.github/workflows/release.yml'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-single-release-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify authoritative release entry points
        run: |
          set -euo pipefail
          grep -Fq './release.sh X.Y.Z' CLAUDE.md
          grep -Fq './release.sh %1' release.bat
          bash -n release.sh
          if grep -Eq 'gh[[:space:]]+release[[:space:]]+create|git[[:space:]]+tag[[:space:]]+"|git[[:space:]]+push[[:space:]]+origin' .github/workflows/release.yml; then
            echo 'Release workflow contains a publication command.' >&2
            exit 1
          fi
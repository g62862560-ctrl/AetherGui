name: Windows CI

on:
  push:
    paths:
      - '*.cs'
      - '*.csproj'
      - 'tests/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - '*.cs'
      - '*.csproj'
      - 'tests/**'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run core checks
        run: dotnet run --project tests/CoreChecks.csproj -c Release
      - name: Build Windows application
        run: dotnet build AetherGui.csproj -c Release --no-restore
